openapi: 3.1.0
info:
  title: FuelUp Route API
  version: 3.0.0
  description: >
    Plans routes in the configured launch market for configurable vehicles,
    exposes price provenance and freshness, and declares all response units.
    The original U.S. endpoint remains temporarily for compatibility only.
paths:
  /api/health/live/:
    get:
      operationId: liveness
      summary: Check that the API process is alive.
      responses:
        "200":
          description: Service process is responding.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/health/ready/:
    get:
      operationId: readiness
      summary: Check station data and cache readiness.
      responses:
        "200":
          description: Service is ready for route traffic.
        "503":
          description: A required dependency is unavailable.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/route/:
    post:
      deprecated: true
      operationId: planRoute
      summary: Legacy U.S. exercise route planner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Route and fuel plan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-FuelUp-Cache:
              description: Complete route-plan cache status.
              schema:
                type: string
                enum: [HIT, MISS]
            X-FuelUp-Cache-TTL:
              description: Configured maximum route-plan cache lifetime in seconds.
              schema:
                type: integer
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePlan"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          description: Client rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/v2/route/:
    post:
      operationId: planRouteV2
      summary: Plan a route for the configured market and vehicle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutePlanRequestV2"
      responses:
        "200":
          description: Route, comparison, fuel plan, and data-quality summary.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-FuelUp-Cache:
              description: Complete route-plan cache status.
              schema:
                type: string
                enum: [HIT, MISS]
            X-FuelUp-Cache-TTL:
              description: Actual TTL bounded by the earliest price expiry.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePlanV2"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
components:
  headers:
    RequestId:
      description: Request correlation identifier.
      schema:
        type: string
    RateLimit:
      schema:
        type: integer
        minimum: 0
  responses:
    Error:
      description: Structured request, domain, or provider error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    MarketMetadata:
      type: object
      required:
        - code
        - country_code
        - country_name
        - currency_code
        - distance_unit
        - volume_unit
        - efficiency_unit
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 2
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        country_name:
          type: string
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
        distance_unit:
          type: string
        volume_unit:
          type: string
        efficiency_unit:
          type: string
    RoutePlanRequestV2:
      type: object
      required: [start, finish, vehicle]
      additionalProperties: false
      properties:
        start:
          type: string
          minLength: 1
          maxLength: 300
          examples: ["Ahmedabad, Gujarat"]
        finish:
          type: string
          minLength: 1
          maxLength: 300
          examples: ["Vadodara, Gujarat"]
        waypoints:
          type: array
          maxItems: 5
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 300
        vehicle:
          $ref: "#/components/schemas/VehicleRequestV2"
        maximum_detour:
          type: number
          exclusiveMinimum: 0
          maximum: 50
          default: 5
        strategy:
          type: string
          enum: [cheapest_estimated, fastest, balanced]
          default: balanced
        price_quality:
          type: string
          enum: [best_available, station_reported_only]
          default: best_available
        allow_stale_prices:
          type: boolean
          default: false
    VehicleRequestV2:
      type: object
      required:
        - fuel_type
        - tank_capacity
        - efficiency
        - starting_fuel
        - reserve_fuel
      additionalProperties: false
      properties:
        fuel_type:
          type: string
          enum: [petrol, diesel]
        fuel_grade:
          type: [string, "null"]
          minLength: 1
          maxLength: 50
        tank_capacity:
          type: number
          exclusiveMinimum: 0
          maximum: 300
        efficiency:
          type: number
          exclusiveMinimum: 0
          maximum: 100
        starting_fuel:
          type: number
          minimum: 0
        reserve_fuel:
          type: number
          minimum: 0
    RoutePlanV2:
      type: object
      required:
        - api_version
        - market
        - start
        - finish
        - waypoints
        - route
        - vehicle
        - fuel_plan
        - comparisons
        - data_quality
        - metadata
      properties:
        api_version:
          const: v2
        market:
          $ref: "#/components/schemas/MarketMetadata"
        start:
          $ref: "#/components/schemas/Location"
        finish:
          $ref: "#/components/schemas/Location"
        waypoints:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        route:
          type: object
          required: [distance, duration_hours, geojson]
          properties:
            distance:
              type: number
            duration_hours:
              type: number
            geojson:
              type: object
        vehicle:
          type: object
          required:
            - fuel_type
            - fuel_grade
            - tank_capacity
            - efficiency
            - starting_fuel
            - reserve_fuel
            - maximum_range
            - maximum_station_detour
          properties:
            fuel_type:
              type: string
              enum: [petrol, diesel]
            fuel_grade:
              type: [string, "null"]
            tank_capacity:
              type: number
            efficiency:
              type: number
            starting_fuel:
              type: number
            reserve_fuel:
              type: number
            maximum_range:
              type: number
            maximum_station_detour:
              type: number
        fuel_plan:
          type: object
          required:
            - starting_fuel
            - reserve_fuel
            - stops
            - total_consumed_volume
            - purchased_volume
            - purchase_cost
            - arrival_fuel
            - currency
          properties:
            starting_fuel:
              type: number
            reserve_fuel:
              type: number
            stops:
              type: array
              items:
                $ref: "#/components/schemas/FuelStopV2"
            total_consumed_volume:
              type: number
            purchased_volume:
              type: number
            purchase_cost:
              type: number
            arrival_fuel:
              type: number
            currency:
              type: string
              minLength: 3
              maxLength: 3
        comparisons:
          type: array
          items:
            type: object
            required:
              - alternative
              - distance
              - duration_hours
              - fuel_stops
              - purchase_cost
              - selection_score
              - requested_strategy
            properties:
              alternative:
                type: integer
              distance:
                type: number
              duration_hours:
                type: number
              fuel_stops:
                type: integer
              purchase_cost:
                type: number
              selection_score:
                type: number
              requested_strategy:
                type: string
                enum: [cheapest_estimated, fastest, balanced]
        data_quality:
          $ref: "#/components/schemas/DataQualityV2"
        metadata:
          type: object
    FuelStopV2:
      type: object
      required:
        - sequence
        - station_id
        - name
        - address
        - city
        - state
        - latitude
        - longitude
        - route_distance
        - distance_to_route
        - unit_price
        - price
        - fuel_on_arrival
        - volume
        - cost
      properties:
        sequence:
          type: integer
        station_id:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        route_distance:
          type: number
        distance_to_route:
          type: number
        unit_price:
          type: number
        price:
          $ref: "#/components/schemas/PriceQuote"
        fuel_on_arrival:
          type: number
        volume:
          type: number
        cost:
          type: number
    PriceQuote:
      type: object
      required:
        - label
        - geographic_precision
        - confidence
        - as_of
        - expires_at
        - observation_ids
        - resolver_version
      properties:
        label:
          type: string
          enum: [live, reported, reference, estimated, stale]
        geographic_precision:
          type: string
          enum: [station, city, district, state, country]
        confidence:
          type: string
          enum: [high, medium, low]
        as_of:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        observation_ids:
          type: array
          items:
            type: string
        resolver_version:
          type: string
    DataQualityV2:
      type: object
      required:
        - station_snapshot
        - observation_watermark
        - required_stop_quotes
        - resolved_stop_quotes
        - price_coverage_percent
        - label_counts
        - confidence_counts
        - warning
      properties:
        station_snapshot:
          type: string
        station_snapshot_generated_at:
          type: [string, "null"]
          format: date-time
        observation_watermark:
          type: integer
        required_stop_quotes:
          type: integer
        resolved_stop_quotes:
          type: integer
        price_coverage_percent:
          type: number
        label_counts:
          type: object
          additionalProperties:
            type: integer
        confidence_counts:
          type: object
          additionalProperties:
            type: integer
        oldest_price_as_of:
          type: [string, "null"]
          format: date-time
        warning:
          type: string
    RouteRequest:
      type: object
      required: [start, finish]
      additionalProperties: false
      properties:
        start:
          type: string
          maxLength: 300
          examples: ["Los Angeles, CA"]
        finish:
          type: string
          maxLength: 300
          examples: ["New York, NY"]
    RoutePlan:
      type: object
      required: [start, finish, route, vehicle, fuel_plan, metadata]
      properties:
        start:
          $ref: "#/components/schemas/Location"
        finish:
          $ref: "#/components/schemas/Location"
        route:
          $ref: "#/components/schemas/Route"
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        fuel_plan:
          $ref: "#/components/schemas/FuelPlan"
        metadata:
          $ref: "#/components/schemas/Metadata"
    Route:
      type: object
      required: [distance_miles, duration_hours, geojson]
      properties:
        distance_miles:
          type: number
        duration_hours:
          type: number
        geojson:
          type: object
          description: GeoJSON FeatureCollection containing route and stops.
    Vehicle:
      type: object
      required:
        [maximum_range_miles, fuel_economy_mpg, tank_capacity_gallons]
      properties:
        maximum_range_miles:
          type: number
          const: 500
        fuel_economy_mpg:
          type: number
          const: 10
        tank_capacity_gallons:
          type: number
          const: 50
    FuelPlan:
      type: object
      required:
        [initial_fuel_estimate, stops, total_gallons, total_cost_usd, currency]
      properties:
        initial_fuel_estimate:
          type: object
        stops:
          type: array
          items:
            $ref: "#/components/schemas/FuelStop"
        total_gallons:
          type: number
        total_cost_usd:
          type: number
        currency:
          const: USD
    FuelStop:
      type: object
      required:
        - sequence
        - opis_id
        - name
        - city
        - state
        - route_mile
        - price_per_gallon_usd
        - fuel_on_arrival_gallons
        - gallons
        - cost_usd
      properties:
        sequence:
          type: integer
        opis_id:
          type: string
        name:
          type: string
        city:
          type: string
        state:
          type: string
        route_mile:
          type: number
        distance_to_route_miles:
          type: number
        price_per_gallon_usd:
          type: number
        fuel_on_arrival_gallons:
          type: number
        gallons:
          type: number
        cost_usd:
          type: number
    Metadata:
      type: object
      required:
        - route_alternatives_evaluated
        - feasible_route_alternatives
        - selection_score_usd
        - selection_policy
      properties:
        route_alternatives_evaluated:
          type: integer
        feasible_route_alternatives:
          type: integer
        selection_score_usd:
          type: number
        selection_policy:
          type: string
    Location:
      type: object
      required: [query, display_name, latitude, longitude]
      properties:
        query:
          type: string
        display_name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    Health:
      type: object
      required: [status, service, release]
      properties:
        status:
          const: ok
        service:
          const: fuelup-api
        release:
          type: string
    Readiness:
      type: object
      required: [status, checks, release]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          properties:
            station_prices:
              type: boolean
            cache:
              type: boolean
        release:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
