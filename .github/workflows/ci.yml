name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, sqlite]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fuelup_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fuelup_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://postgres:postgres@localhost:5432/fuelup_ci' || 'sqlite:////tmp/fuelup-ci.sqlite3' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install matching PostgreSQL backup tools
        if: matrix.database == 'postgresql'
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Lint backend
        run: ruff check fuelup routes scripts manage.py gunicorn.conf.py

      - name: Run tests with branch coverage
        run: |
          coverage run manage.py test
          coverage report

      - name: Run Django and migration checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run production security checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-unique-characters-1234567890
        run: python manage.py check --deploy --settings=fuelup.settings.production

      - name: Validate deployment manifests
        run: python scripts/validate_manifests.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Verify desktop and mobile browser flows
        run: npm run test:browser

      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: frontend/test-results/
          retention-days: 3

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t fuelup-backend:ci .

      - name: Build frontend image
        run: docker build -t fuelup-frontend:ci frontend
