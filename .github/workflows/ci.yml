name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test

      - name: Run Django checks
        run: python manage.py check

      - name: Run production security checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-unique-characters-1234567890
        run: python manage.py check --deploy --settings=fuelup.settings_prod
